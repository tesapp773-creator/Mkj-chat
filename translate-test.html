<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translate Function — Test</title>
<style>
  *{box-sizing:border-box;}
  body{font-family:-apple-system,'Segoe UI',sans-serif;background:#111;color:#eee;padding:20px;max-width:480px;margin:0 auto;}
  h1{font-size:18px;margin-bottom:4px;}
  p.sub{color:#999;font-size:13px;margin-top:0;margin-bottom:20px;}
  label{display:block;font-size:12px;color:#aaa;margin-bottom:4px;margin-top:14px;}
  input,textarea,select{width:100%;padding:10px;background:#222;border:1px solid #444;border-radius:8px;color:#eee;font-size:14px;}
  textarea{min-height:70px;resize:vertical;}
  button{width:100%;margin-top:18px;padding:13px;background:#2e7d32;border:none;border-radius:8px;color:#fff;font-weight:700;font-size:15px;cursor:pointer;}
  button:disabled{background:#555;cursor:not-allowed;}
  #result{margin-top:20px;padding:14px;border-radius:8px;font-size:13px;white-space:pre-wrap;word-break:break-word;display:none;}
  #result.success{background:#1b3a1e;border:1px solid #2e7d32;display:block;}
  #result.error{background:#3a1b1b;border:1px solid #7d2e2e;display:block;}
  #result.loading{background:#222;border:1px solid #444;display:block;color:#999;}
  .label-tag{font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:6px;display:block;}
  .success .label-tag{color:#4caf50;}
  .error .label-tag{color:#f44336;}
</style>
</head>
<body>

<h1>🌐 Translate Function Test</h1>
<p class="sub">Sends one request to /.netlify/functions/translate — shows the real response, success or error.</p>

<label for="text">Text to translate</label>
<textarea id="text">The GRACE mission is a collaboration between NASA and the German Aerospace Center.</textarea>

<label for="source">Source language code</label>
<select id="source">
  <option value="en" selected>English (en)</option>
  <option value="fr">French (fr)</option>
  <option value="es-ES">Spanish (es-ES)</option>
</select>

<label for="target">Target language code</label>
<select id="target">
  <option value="zh-cn" selected>Chinese (zh-cn) — NVIDIA's own confirmed example pair</option>
  <option value="es-US">LATAM Spanish (es-US)</option>
  <option value="es-ES">European Spanish (es-ES)</option>
  <option value="fr">French (fr)</option>
  <option value="de">German (de)</option>
  <option value="yo">Yoruba (yo)</option>
  <option value="ha">Hausa (ha)</option>
  <option value="ig">Igbo (ig)</option>
</select>

<button id="runBtn" onclick="runTest()">Send Test Request</button>

<div id="result"></div>

<script>
async function runTest(){
  const btn = document.getElementById('runBtn');
  const result = document.getElementById('result');
  const text = document.getElementById('text').value.trim();
  const sourceLang = document.getElementById('source').value;
  const targetLang = document.getElementById('target').value;

  if(!text){
    result.className = 'error';
    result.textContent = 'Please enter some text to translate.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending…';
  result.className = 'loading';
  result.textContent = 'Calling /.netlify/functions/translate ...';

  const startTime = Date.now();

  try{
    const res = await fetch('/.netlify/functions/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, sourceLang, targetLang })
    });

    const elapsed = Date.now() - startTime;
    const data = await res.json();

    if(res.ok && data.translatedText){
      result.className = 'success';
      result.innerHTML = '';
      const tag = document.createElement('span');
      tag.className = 'label-tag';
      tag.textContent = `✅ Success (${res.status}) — ${elapsed}ms`;
      result.appendChild(tag);
      result.appendChild(document.createTextNode(data.translatedText));
    } else {
      result.className = 'error';
      result.innerHTML = '';
      const tag = document.createElement('span');
      tag.className = 'label-tag';
      tag.textContent = `❌ Error (${res.status}) — ${elapsed}ms`;
      result.appendChild(tag);
      result.appendChild(document.createTextNode(JSON.stringify(data, null, 2)));
    }
  }catch(err){
    result.className = 'error';
    result.innerHTML = '';
    const tag = document.createElement('span');
    tag.className = 'label-tag';
    tag.textContent = '❌ Network / unexpected error';
    result.appendChild(tag);
    result.appendChild(document.createTextNode(err.message));
  }finally{
    btn.disabled = false;
    btn.textContent = 'Send Test Request';
  }
}
</script>

</body>
</html>
